name: "ChainSkillsRadar"
description: "Generate a configurable radar-chart SVG for a GitHub README"
author: "ChainSkillsRadar contributors"

inputs:
  config:
    description: "Path to a radar.json configuration file"
    required: false
    default: "radar.json"
  output:
    description: "Path where the generated SVG will be written"
    required: false
    default: "assets/radar.svg"
  values:
    description: "Optional JSON object overriding all category values"
    required: false
  color:
    description: "Optional hex color override, for example #6366f1"
    required: false
  fill_opacity:
    description: "Optional fill opacity override from 0 to 1"
    required: false
  max:
    description: "Optional maximum scale value"
    required: false
  format:
    description: "Optional layout override: wide or square"
    required: false
  size:
    description: "Optional square canvas side in pixels (default: 900)"
    required: false
  label_font_size:
    description: "Optional category label font size in pixels"
    required: false
  title_font_size:
    description: "Optional title font size in pixels"
    required: false

outputs:
  svg:
    description: "Path to the generated SVG"

runs:
  using: "node24"
  main: "action/index.mjs"

branding:
  icon: "activity"
  color: "blue"
